kind = "api"
previewPath = "/api"
title = "API Server"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/api"]

[services.development]
run = "pnpm --filter @workspace/api-server run dev"

[services.production]

[services.production.build]
args = ["uv", "sync", "--no-dev"]

[services.production.run]
args = ["uv", "run", "--no-sync", "python", "artifacts/api-server/run_services.py"]

[services.production.run.env]
PORT = "8080"

[services.production.health.startup]
path = "/api/health"