    <title>Aiviate Dispatch | Smart Logistics & Route Optimization</title>
    <meta name="description" content="Aiviate Dispatch is a smart logistics platform for delivery route optimization, driver management, and explainable dispatching. Streamline your fleet operations with intelligent routing." />
    <meta name="keywords" content="logistics, dispatch, route optimization, fleet management, delivery, driver management, SaaS, last-mile delivery, route planning" />
    <meta name="author" content="Aiviate" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#f4f5f7" />
    <script>
      (function () {
        var mode = "light";
        try {
          if (localStorage.getItem("aiviate_theme_mode") === "dark") mode = "dark";
        } catch (e) { /* Storage may be disabled; keep the light default. */ }
        document.documentElement.dataset.theme = mode;
        document.documentElement.classList.toggle("dark-ui", mode === "dark");
        document.querySelector('meta[name="theme-color"]').content = mode === "dark" ? "#0f1113" : "#f4f5f7";
      })();
    </script>
