kind = "mobile"
previewPath = "/aiviate-driver/"
title = "Aiviate Driver"
description = "The existing Expo driver app for signing in, viewing assigned deliveries, navigating routes, and recording proof of delivery."
version = "1.0.0"
id = "artifacts/aiviate-driver"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/aiviate-driver/" ]
localPort = 20697

[services.development]
run = "pnpm --filter @workspace/aiviate-driver run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/aiviate-driver", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/aiviate-driver", "run", "serve" ]

[services.env]
PORT = "20697"
BASE_PATH = "/aiviate-driver/"
