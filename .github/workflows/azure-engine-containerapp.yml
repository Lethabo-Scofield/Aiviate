name: Deploy Decision Engine Container App

on:
  push:
    branches:
      - main
    paths:
      - 'Website/aiviate-engine/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_test_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install engine dependencies
        working-directory: Website/aiviate-engine
        run: python -m pip install -e ".[postgres]"

      - name: Run engine smoke tests
        working-directory: Website/aiviate-engine
        run: python -m pytest -q tests/unit/test_order_validation.py tests/unit/test_clustering.py

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.AZURE_CONTAINER_REGISTRY }}
          username: ${{ vars.AZURE_CONTAINER_REGISTRY_USERNAME }}
          password: ${{ secrets.AZURE_CONTAINER_REGISTRY_PASSWORD }}

      - name: Build and push engine image
        uses: docker/build-push-action@v6
        with:
          context: ./Website/aiviate-engine
          push: true
          tags: ${{ vars.AZURE_CONTAINER_REGISTRY }}/${{ vars.AZURE_ENGINE_IMAGE_NAME }}:${{ github.sha }}

      - name: Update Azure Container App image
        uses: azure/CLI@v2
        with:
          inlineScript: |
            az containerapp update \
              --name "${{ vars.AZURE_CONTAINER_APP_NAME }}" \
              --resource-group "${{ secrets.AZURE_CONTAINER_APP_RESOURCE_GROUP }}" \
              --image "${{ vars.AZURE_CONTAINER_REGISTRY }}/${{ vars.AZURE_ENGINE_IMAGE_NAME }}:${{ github.sha }}"
