services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      AIVIATE_DATABASE_URL: postgresql+psycopg://aiviate:aiviate@db:5432/aiviate
      AIVIATE_GEOCODING_PROVIDER: local
      AIVIATE_MATRIX_PROVIDER: haversine   # switch to "osrm" and set AIVIATE_OSRM_BASE_URL
      AIVIATE_JOBS_EAGER: "false"
      AIVIATE_LOG_JSON: "true"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: aiviate
      POSTGRES_PASSWORD: aiviate
      POSTGRES_DB: aiviate
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiviate"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Optional: self-hosted road matrix for real travel times.
  # Download an extract (e.g. south-africa-latest.osm.pbf) and preprocess per
  # OSRM docs, then point AIVIATE_OSRM_BASE_URL at this service.
  # osrm:
  #   image: osrm/osrm-backend
  #   command: osrm-routed --algorithm mld /data/south-africa-latest.osrm
  #   volumes:
  #     - ./osrm-data:/data
  #   ports:
  #     - "5000:5000"

volumes:
  pgdata:
