[project]
name = "repl-nix-workspace"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "bcrypt>=5.0.0",
    "fastapi>=0.141.1",
    "flask>=3.1.3",
    "flask-cors>=6.0.5",
    "geopy>=2.5.0",
    "gunicorn>=26.2.0",
    "httpx>=0.28.1",
    "openai>=3.19.2",
    "openpyxl>=3.1.5",
    "ortools>=9.15.6755",
    "pg8000>=1.31.5",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.0",
    "requests>=2.34.2",
    "sqlalchemy>=2.1.1",
    "uvicorn>=0.54.0",
]

[tool.vercel]
entrypoint = "vercel_app:app"

[tool.vercel.scripts]
build = "pnpm install --frozen-lockfile && PORT=19317 BASE_PATH=/ pnpm --filter @workspace/aiviate-dispatch run build"
