name: Deploy Website Backend API

on:
  push:
    branches:
      - main
    paths:
      - 'Website/backend/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        working-directory: Website/backend
        run: pip install -r requirements.txt

      - name: Validate backend Python files
        working-directory: Website/backend
        run: python -m py_compile app.py models.py routes/orders.py routes/support.py wsgi.py

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_API_APP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_API }}
          package: ./Website/backend
